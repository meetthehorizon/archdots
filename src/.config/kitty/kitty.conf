# Font: JetBrains Mono Nerd Font
# normal → Light weight, bold → Regular weight, italic → Light Italic
font_family      JetBrainsMono NFM Light
bold_font        JetBrainsMono NFM
italic_font      JetBrainsMono NFM Light
bold_italic_font JetBrainsMono NFM
font_size        12.0

# Transparent background with blur (blur requires a compositor, e.g. Hyprland)
background_opacity 0.85
background_blur    20

# Sensible defaults
cursor_shape        block
scrollback_lines    10000
